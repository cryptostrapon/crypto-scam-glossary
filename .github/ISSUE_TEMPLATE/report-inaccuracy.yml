name: Report an inaccuracy
description: A wrong fact, a broken link, or an unclear explanation
title: "[Fix] "
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes:
      label: Which entry (vector or title)?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Include a public source if you can.
    validations:
      required: true
